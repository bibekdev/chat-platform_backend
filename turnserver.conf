# =============================================================================
# coturn TURN Server Configuration
# =============================================================================

# ---- Network Settings ----

# STUN/TURN listener port (default: 3478)
listening-port=3478

# TLS listener port (default: 5349)
tls-listening-port=5349

# Listener IP address (0.0.0.0 = all interfaces)
listening-ip=0.0.0.0

# External/public IP address of the server
# Replace with your actual public IP
# If behind NAT, set both external-ip and relay-ip
# external-ip=YOUR_PUBLIC_IP/YOUR_PRIVATE_IP
external-ip=YOUR_PUBLIC_IP

# Relay address (use your server's private/internal IP)
relay-ip=0.0.0.0

# ---- Relay Port Range ----
min-port=49152
max-port=65535

# ---- Authentication ----

# Use long-term credential mechanism
lt-cred-mech

# Static user accounts (user:password)
# For production, use a database instead
user=myuser:mypassword

# Shared secret for TURN REST API (time-limited credentials)
# Uncomment to use dynamic credentials instead of static users
# use-auth-secret
# static-auth-secret=YOUR_STRONG_SECRET_HERE

# Realm (set to your domain)
realm=example.com

# ---- TLS/DTLS Settings ----
# Uncomment and set paths to enable TLS

# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# Disable old TLS/SSL versions
no-tlsv1
no-tlsv1_1

# ---- Logging ----

# Enable verbose logging (disable in production for performance)
verbose

# Log file (stdout for Docker)
log-file=stdout

# ---- Security ----

# Fingerprint in TURN messages
fingerprint

# Disable multicast peers
no-multicast-peers

# Block private/loopback IPs from being relayed to (security)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# ---- Performance ----

# Max total allocation quota
total-quota=100

# Max bytes-per-second bandwidth per session
# 0 = unlimited
max-bps=0

# Stale nonce lifetime (seconds)
stale-nonce=600

# ---- Misc ----

# Server name for STUN responses
server-name=coturn

# Disable CLI
no-cli

# Process user ID (run as non-root)
# proc-user=turnserver
# proc-group=turnserver