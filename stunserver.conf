# =============================================================================
# coturn STUN-Only Server Configuration
# =============================================================================
# Use this config if you only need a STUN server (no TURN relay).
# STUN is used for NAT traversal / public IP discovery only.

# ---- Network Settings ----

# STUN listener port
listening-port=3478

# Listen on all interfaces
listening-ip=0.0.0.0

# External/public IP
# Replace with your actual public IP
external-ip=YOUR_PUBLIC_IP

# ---- STUN-Only Mode ----

# Disable TURN relay functionality (STUN only)
no-turn

# ---- TLS Settings ----

# TLS listening port for STUN over TLS
tls-listening-port=5349

# Uncomment for TLS support
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

no-tlsv1
no-tlsv1_1

# ---- Logging ----

verbose
log-file=stdout

# ---- Security ----

fingerprint

# Server name
server-name=stunserver

# Disable CLI
no-cli

# ---- Performance ----

# Stale nonce lifetime
stale-nonce=600